name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npx --yes npm@10.9.4 ci
      - name: npm run check
        run: npm run check
      - name: npm run build
        run: npm run build
      - name: npm test
        run: npm test
      - name: npm run smoke
        run: npm run smoke
      - name: npm run package:smoke
        run: npm run package:smoke
