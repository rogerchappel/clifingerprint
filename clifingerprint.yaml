# Probe configuration for clifingerprint CLI contract recorder

tool: "bash fixtures/greeter.sh"
packageFile: "package.json"

metadata:
  description: Example probe config using fixture CLI

probes:
  - name: greeter-help
    args:
      - "--help"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: greeter-version
    args:
      - "--version"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: greeter-loud
    args:
      - "--loud"
      - "World"
    expectedExitCode: 0
    timeoutMs: 10000
