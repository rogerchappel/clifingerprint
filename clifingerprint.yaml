# Probe configuration for clifingerprint CLI contract recorder

tool: "bash fixtures/stable-cli.js"

metadata:
  description: Example probe config using fixture CLIs

probes:
  - name: stable-help
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - "--help"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: stable-version
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - "--version"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: stable-greet
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - greet
      - "--name"
      - Test
    expectedExitCode: 0
    timeoutMs: 10000

  - name: stable-add
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - add
      - "5"
      - "10"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: stable-fail
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - fail
    expectedExitCode: 1
    timeoutMs: 10000

  - name: stable-no-args
    tool: "node"
    args:
      - fixtures/stable-cli.js
    expectedExitCode: 0
    timeoutMs: 10000
