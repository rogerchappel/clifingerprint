# Probe configuration for clifingerprint CLI contract recorder

tool: "bash fixtures/stable-cli.js"

metadata:
  description: Example probe config using fixture CLIs

probes:
  - name: stable-help
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - "--help"
    expectedExitCode: 0
    timeoutMs: 10000

  - name: stable-version
    tool: "node"
    args:
      - fixtures/stable-cli.js
      - "--version"
    expectedExitCode: 0
    timeoutMs: 10000
