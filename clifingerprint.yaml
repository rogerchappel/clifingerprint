# Probe configuration for clifingerprint CLI contract recorder

metadata:
  description: Example probe config using fixture CLIs

probes:
  - id: stable-help
    command: node
    args:
      - test/fixtures/stable-cli.js
      - "--help"
    expectedExitCode: 0
    timeoutMs: 10000

  - id: stable-version
    command: node
    args:
      - test/fixtures/stable-cli.js
      - "--version"
    expectedExitCode: 0
    timeoutMs: 10000

  - id: stable-greet
    command: node
    args:
      - test/fixtures/stable-cli.js
      - greet
      - "--name"
      - Test
    expectedExitCode: 0
    timeoutMs: 10000

  - id: stable-add
    command: node
    args:
      - test/fixtures/stable-cli.js
      - add
      - "5"
      - "10"
    expectedExitCode: 0
    timeoutMs: 10000

  - id: stable-fail
    command: node
    args:
      - test/fixtures/stable-cli.js
      - fail
    expectedExitCode: 1
    timeoutMs: 10000

  - id: stable-no-args
    command: node
    args:
      - test/fixtures/stable-cli.js
    expectedExitCode: 0
    timeoutMs: 10000
